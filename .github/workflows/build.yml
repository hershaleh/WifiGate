name: Build WifiGate exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WifiGateSetup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Compress-Archive -Path WifiGate -DestinationPath build\payload.zip -Force
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:anycpu /out:build\WifiGateSetup.exe `
            /win32manifest:installer\app.manifest `
            /resource:build\payload.zip,payload.zip `
            /reference:System.Windows.Forms.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.IO.Compression.dll `
            installer\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          Get-Item build\WifiGateSetup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WifiGateSetup
          path: build/WifiGateSetup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload latest build\WifiGateSetup.exe --clobber
            if ($LASTEXITCODE -ne 0) { throw "upload failed" }
            gh release edit latest --target $env:GITHUB_SHA --notes "Built from $env:GITHUB_SHA"
          } else {
            gh release create latest build\WifiGateSetup.exe --target $env:GITHUB_SHA --title "WifiGateSetup (latest)" --notes "Built from $env:GITHUB_SHA"
            if ($LASTEXITCODE -ne 0) { throw "create failed" }
          }

      - name: Report build status to ci-build branch
        if: always()
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'status'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $exe = 'build\WifiGateSetup.exe'
          $info = "sha=$env:GITHUB_SHA`\njob=${{ job.status }}`\n"
          if (Test-Path $exe) { $info += "exe_bytes=$((Get-Item $exe).Length)`\nexe_sha256=$((Get-FileHash $exe).Hash)`\n" } else { $info += "exe=missing`\n" }
          Set-Content -Path "$tmp\build-status.txt" -Value $info
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-build
          git rm -rf . | Out-Null
          Copy-Item "$tmp\build-status.txt" .
          git add -A
          git commit -m "build status"
          git push -f origin ci-build
