name: Build WifiGate exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WifiGateSetup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Compress-Archive -Path WifiGate -DestinationPath build\payload.zip -Force
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:anycpu /out:build\WifiGateSetup.exe `
            /win32manifest:installer\app.manifest `
            /resource:build\payload.zip,payload.zip `
            /reference:System.Windows.Forms.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.IO.Compression.dll `
            installer\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          Get-Item build\WifiGateSetup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WifiGateSetup
          path: build/WifiGateSetup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $log = Join-Path $env:RUNNER_TEMP 'publish.txt'
          $ErrorActionPreference = 'Continue'
          $v = gh release view latest 2>&1
          "view exit=$LASTEXITCODE" | Add-Content $log
          if ($LASTEXITCODE -eq 0) {
            $r = gh release upload latest build\WifiGateSetup.exe --clobber 2>&1
            "upload exit=$LASTEXITCODE $r" | Add-Content $log
            $up = $LASTEXITCODE
            $r = gh release edit latest --target $env:GITHUB_SHA --notes "Built from $env:GITHUB_SHA" 2>&1
            "edit exit=$LASTEXITCODE $r" | Add-Content $log
            if ($up -ne 0) { exit 1 }
          } else {
            $r = gh release create latest build\WifiGateSetup.exe --target $env:GITHUB_SHA --title "WifiGateSetup (latest)" --notes "Built from $env:GITHUB_SHA" 2>&1
            "create exit=$LASTEXITCODE $r" | Add-Content $log
            if ($LASTEXITCODE -ne 0) { exit 1 }
          }

      - name: Report build status to ci-build branch
        if: always()
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP 'status'
          New-Item -ItemType Directory -Force $tmp | Out-Null
          $exe = 'build\WifiGateSetup.exe'
          $lines = @("sha=$env:GITHUB_SHA", "job=${{ job.status }}")
          if (Test-Path $exe) { $lines += "exe_bytes=$((Get-Item $exe).Length)"; $lines += "exe_sha256=$((Get-FileHash $exe).Hash)" } else { $lines += 'exe=missing' }
          $pub = Join-Path $env:RUNNER_TEMP 'publish.txt'
          if (Test-Path $pub) { $lines += '--- publish ---'; $lines += (Get-Content $pub) }
          Set-Content -Path "$tmp\build-status.txt" -Value $lines
          git config user.name "ci"; git config user.email "ci@example.com"
          git checkout --orphan ci-build
          git rm -rf . | Out-Null
          Copy-Item "$tmp\build-status.txt" .
          git add -A
          git commit -m "build status"
          git push -f origin ci-build
