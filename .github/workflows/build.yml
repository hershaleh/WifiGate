name: Build WifiGate exe

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build WifiGateSetup.exe
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          Compress-Archive -Path WifiGate -DestinationPath build\payload.zip -Force
          $csc = "$env:WINDIR\Microsoft.NET\Framework64\v4.0.30319\csc.exe"
          & $csc /nologo /target:winexe /platform:anycpu /out:build\WifiGateSetup.exe `
            /win32manifest:installer\app.manifest `
            /resource:build\payload.zip,payload.zip `
            /reference:System.Windows.Forms.dll /reference:System.IO.Compression.FileSystem.dll /reference:System.IO.Compression.dll `
            installer\Launcher.cs
          if ($LASTEXITCODE -ne 0) { throw "csc failed" }
          Get-Item build\WifiGateSetup.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: WifiGateSetup
          path: build/WifiGateSetup.exe

      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag 2>$null
          gh release create latest build\WifiGateSetup.exe --title "WifiGateSetup (latest)" --notes "Built from $env:GITHUB_SHA"
