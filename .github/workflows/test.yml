name: Test firewall logic

on:
  workflow_dispatch:
  push:
    paths: ['WifiGate/**', 'tests/**', '.github/workflows/test.yml']

permissions:
  contents: write

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax, logic and UI screenshots (Windows PowerShell 5.1)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File tests\ci.ps1 -Root "$PWD" -ShotDir "$PWD\shots"
          exit $LASTEXITCODE
      - name: Publish screenshots to ci-screens branch
        if: always()
        shell: pwsh
        run: |
          if (Test-Path shots) {
            $tmp = Join-Path $env:RUNNER_TEMP 'shots'
            New-Item -ItemType Directory -Force $tmp | Out-Null
            Copy-Item shots\*.png $tmp
            if (Test-Path ci-result.txt) { Copy-Item ci-result.txt $tmp }
            git config user.name "ci"; git config user.email "ci@example.com"
            git checkout --orphan ci-screens
            git rm -rf . | Out-Null
            Copy-Item "$tmp\*" .
            git add -A
            git commit -m "ci screenshots"
            git push -f origin ci-screens
          }
